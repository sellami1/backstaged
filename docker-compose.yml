services:
  api-gateway:
    build:
      context: ./services/api-gateway
    environment:
      PORT: 3000
      USERS_SERVICE_URL: http://users-service:3001
      TASKS_SERVICE_URL: http://tasks-service:3002
    ports:
      - "3000:3000"
    depends_on:
      users-service:
        condition: service_healthy
      tasks-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  users-service:
    build:
      context: ./services/users-service
    environment:
      PORT: 3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  tasks-service:
    build:
      context: ./services/tasks-service
    environment:
      PORT: 3002
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
