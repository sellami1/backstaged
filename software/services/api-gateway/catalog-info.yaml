apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: taskhub-api-gateway
  description: Public HTTP entry point that forwards requests to TaskHub backend services
  tags:
    - nodejs
    - express
    - api-gateway
  annotations:
    backstage.io/techdocs-ref: dir:../../
spec:
  type: service
  lifecycle: experimental
  owner: user:default/fatma
  system: taskhub
  providesApis:
    - taskhub-http-api
  dependsOn:
    - component:default/taskhub-users-service
    - component:default/taskhub-tasks-service
